<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-1 Student Marks Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="form_box">
            <form action="" class="student_form">
                <label for="Name">Name:
                    <input type="text" id="student_name">
                </label><br>
                <label for="Roll">Roll:
                    <input type="number" id="student_roll">
                </label><br>
                <label for="subject_marks" id="student_marks">
                    Marks:
                    <input type="text" name="subject_marks" id="subject_marks">
                </label><br>
                <button id="submit_btn">Submit</button>
            </form>
        </div>

        <div class="output">
            Output Box:
    </div>
    <script src="script.js"></script>
</body>

</html>
